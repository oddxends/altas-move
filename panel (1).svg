<text x="80.0" y="850" class="b">TRACK 1</text>
<text x="152.0" y="850" class="t">Added bass</text>
<text x="80.0" y="870" class="b">TRACK 2</text>
<text x="152.0" y="870" class="t">Chord</text>
<text x="80.0" y="890" class="b">TRACK 3</text>
<text x="152.0" y="890" class="t">Arp — press again for 9 directions</text>
<text x="80.0" y="910" class="b">TRACK 4</text>
<text x="152.0" y="910" class="t">Strum — press again for 4</text>
<text x="80.0" y="940" class="s">Arp needs the transport running.</text>
<rect x="440.0" y="800" width="336.0" height="2" fill="#111"/>
