<text x="80" y="196" class="h1">ATLAS</text>
<text x="80" y="230" class="h2">CHORD INSTRUMENT FOR ABLETON MOVE</text>
<text x="710.0" y="168" class="lead">Twenty pages of harmony</text>
<text x="710.0" y="196" class="lead">on the pads. Arpeggiator,</text>
<text x="710.0" y="224" class="lead">strummer, two bass lanes.</text>
<text x="710.0" y="256" class="s">A Schwung overtake module. Sends MIDI over USB.</text>
<rect x="80" y="280" width="1080" height="1" fill="#111"/>
<text x="80" y="322" class="cap">THE IDEA</text>
<text x="80" y="356" class="lead">Columns are <tspan font-weight="700">which chord</tspan>. Rows are <tspan font-weight="700">how thick</tspan> it is.</text>
<text x="80" y="382" class="t">Slide sideways to move through a progression. Slide up the same column to reharmonise the chord you are already on.</text>
